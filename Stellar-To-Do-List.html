<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stellar-To-Do-List</title>
    <link
      rel="icon"
      type="image/png"
      href="https://cdn-icons-png.flaticon.com/512/3212/3212580.png"
    />
    <link rel="stylesheet" href="style.css" />

    <!--
      integrity 是「這個檔案必須是這份內容，否則不要執行」。
      沒有它的話，這一行等於無條件信任 cdnjs 未來送過來的任何東西——CDN 被入侵、
      或帳號被接管而換掉檔案時，瀏覽器會照樣把它當成本頁的程式碼跑，而那份程式碼
      能碰到這一頁的所有東西（包含 localStorage 裡的待辦事項）。
      雜湊值取自 cdnjs 官方 API 公布的 SRI，並自行下載檔案重算比對過。
      crossorigin="anonymous" 是 SRI 在跨來源腳本上生效的必要條件，不能省。
    -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"
      integrity="sha512-dLxUelApnYxpLt6K2iomGngnHO83iUvZytA3YjDUCjT0HDOHKXnVYdf3hU4JjM8uEhxf9nD1/ey98U3t2vZ0qQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
  </head>
  <body>
    <div class="orb-container" id="orb-trigger">
      <div id="earth-container"></div>
      <p class="orb-text">To Do List</p>
    </div>

    <div class="main-container hidden" id="app-container">
      <h2>List</h2>

      <button onclick="testNotification()" class="test-btn">
        Send test notification
      </button>

      <div class="input-group">
        <input type="text" id="input-box" placeholder="Enter task details..." />

        <input
          type="text"
          id="time-box"
          placeholder="Select Date & Time..."
          onfocus="this.type = 'datetime-local'"
          onblur="
            this.value ? (this.type = 'datetime-local') : (this.type = 'text')
          "
        />

        <button onclick="addTask()" class="add-btn">Submit</button>
      </div>

      <ul id="list-container"></ul>

      <button class="close-btn" onclick="closeApp()">Return to Earth</button>
    </div>

    <div id="returning-overlay" class="hidden">
      <div class="returning-content">
        <div class="loading-text">Loading...</div>
        <div class="progress-track">
          <div class="progress-fill"></div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
